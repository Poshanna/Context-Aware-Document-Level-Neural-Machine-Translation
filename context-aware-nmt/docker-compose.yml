services:
  db:
    image: postgres:15-alpine
    container_name: canmt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-context_aware_nmt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-context_aware_nmt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canmt-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-context_aware_nmt}
      - UPLOAD_DIR=/app/uploads
      - HF_HOME=/app/.cache/hf
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - hf_cache:/app/.cache/hf
    ports:
      - "8000:8000"
    # Uncomment to use NVIDIA GPU; requires nvidia-container-toolkit on host
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    shm_size: '2gb'
    command: >
      sh -c "
        uvicorn app.main:app
          --host 0.0.0.0
          --port 8000
          --reload
          --proxy-headers
          --forwarded-allow-ips='*'
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health').read().decode()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: canmt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  uploads:
  hf_cache:
